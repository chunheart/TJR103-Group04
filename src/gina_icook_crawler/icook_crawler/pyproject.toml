[tool.poetry]
name = "icook-crawler"
version = "1.0.0"
description = "Automated iCook recipe crawler with Docker + scheduler + auto resume + Kafka + MongoDB"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"

# 網路請求與 HTML 解析
requests = "^2.32.3"
beautifulsoup4 = "^4.12.3"
lxml = "^5.3.0"

# 資料處理與時間控制
schedule = "^1.2.1"
pytz = "^2024.1"

# Kafka 整合
kafka-python = "^2.0.2"

# （可選）若之後想分析 CSV 或產生報表
pandas = "^2.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

